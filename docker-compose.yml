services:
  consumer-transactional:
    container_name: notification-consumer-transactional
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    environment:
      SERVICE_NAME: notification-transactional
      KAFKA_CONSUMER_TOPICS: notification.transactional
      KAFKA_CONSUMER_GROUP: notification-transactional
      KAFKA_CONSUMER_DLQ_TOPIC: notification.transactional.dlq
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

  consumer-social:
    container_name: notification-consumer-social
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    environment:
      SERVICE_NAME: notification-social
      KAFKA_CONSUMER_TOPICS: notification.social
      KAFKA_CONSUMER_GROUP: notification-social
      KAFKA_CONSUMER_DLQ_TOPIC: notification.social.dlq
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

  consumer-marketing:
    container_name: notification-consumer-marketing
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    environment:
      SERVICE_NAME: notification-marketing
      KAFKA_CONSUMER_TOPICS: notification.marketing
      KAFKA_CONSUMER_GROUP: notification-marketing
      KAFKA_CONSUMER_DLQ_TOPIC: notification.marketing.dlq
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

  worker:
    container_name: notification-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    entrypoint: ["/app/worker"]
    networks:
      - data
      - messaging
      - observability
      - podman-ipv6
    restart: unless-stopped

networks:
  data:
    external: true
    name: data

  messaging:
    external: true
    name: messaging

  observability:
    external: true
    name: observability
